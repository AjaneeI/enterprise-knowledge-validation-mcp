<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
<title id="title">Implemented architecture and proposed integration</title><desc id="desc">An MCP client calls exactly two Python tools. They read packaged synthetic JSON and return structured assessments. A separate dashed region describes an unimplemented Glean integration.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1730"/><stop offset="1" stop-color="#34358c"/></linearGradient><linearGradient id="accent"><stop stop-color="#47d8ec"/><stop offset="1" stop-color="#ac9bff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="#526580"/></marker></defs>
<rect x="0" y="0" width="1280" height="650" rx="24" fill="#f4f7fc"/><text xml:space="preserve" x="48" y="57" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">A small server with an explicit evidence path</text><text xml:space="preserve" x="48" y="91" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Implemented: Python + official MCP SDK. No model calls, retrieval index or operational writes.</text><rect x="28" y="127" width="1224" height="351" rx="20" fill="#eaf0fc" stroke="#d5deee" stroke-width="2"/><text xml:space="preserve" x="52" y="158" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">IMPLEMENTED · LOCAL SYNTHETIC DEMONSTRATION</text><rect x="52" y="201" width="218" height="124" rx="18" fill="#ffffff" stroke="#d5deee" stroke-width="2"/><text xml:space="preserve" x="76" y="240" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">MCP client</text><text xml:space="preserve" x="76" y="273" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Official SDK / Inspector</text><text xml:space="preserve" x="76" y="301" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">stdio or loopback HTTP</text><rect x="320" y="186" width="590" height="187" rx="18" fill="#ffffff" stroke="#8995e3" stroke-width="2"/><text xml:space="preserve" x="344" y="219" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Python MCP server · FastMCP</text><text xml:space="preserve" x="344" y="248" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Strict identifiers and typed responses</text><rect x="344" y="265" width="542" height="40" rx="8" fill="#eef1ff"/><text xml:space="preserve" x="360" y="292" fill="#152643" font-family="monospace" font-size="20" font-weight="400">check_procedure_status(procedure_id)</text><rect x="344" y="315" width="542" height="40" rx="8" fill="#eef1ff"/><text xml:space="preserve" x="360" y="342" fill="#152643" font-family="monospace" font-size="20" font-weight="400">assess_action_readiness(action_id)</text><path d="M270 250H310" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/><rect x="964" y="201" width="264" height="158" rx="18" fill="#ffffff" stroke="#d5deee" stroke-width="2"/><text xml:space="preserve" x="985" y="239" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Synthetic snapshot</text><text xml:space="preserve" x="985" y="274" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">3 procedures · 5 actions</text><text xml:space="preserve" x="985" y="305" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">10 proof · 5 approvals</text><text xml:space="preserve" x="985" y="337" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Fixed evaluation clock</text><path d="M910 280H954" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="398" width="590" height="54" rx="12" fill="#0b1730"/><text xml:space="preserve" x="344" y="432" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Structured JSON · citations · blockers · review status</text><path d="M615 373V390" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 425H162V335" fill="none" stroke="#526580" stroke-width="3" marker-end="url(#arrow)"/><text xml:space="preserve" x="940" y="430" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">No external source fetching</text><rect x="28" y="510" width="1224" height="111" rx="18" fill="#f5f2ff" stroke="#9986df" stroke-width="2" stroke-dasharray="7 6"/><text xml:space="preserve" x="52" y="548" fill="#6050a0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">PROPOSED ONLY · GLEAN INTEGRATION</text><text xml:space="preserve" x="52" y="582" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Authorized Glean host → secured endpoint → permission-scoped evidence → human reviewer</text><text xml:space="preserve" x="52" y="606" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">No connection from this repository: hosting, identity, permissions and tenant compatibility are unimplemented.</text></svg>
