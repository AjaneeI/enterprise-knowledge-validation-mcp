<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">Enterprise Knowledge Validation MCP</title><desc id="desc">From Enterprise Knowledge to Trusted Action. Two read-only MCP tools validate a synthetic snapshot and return evidence for human review.</desc>
