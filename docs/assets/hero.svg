n an assessment</text><text xml:space="preserve" x="894" y="325" fill="#becce7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Citations and explicit blockers</text><path d="M861 165V190M861 242V267" fill="none" stroke="#62739f" stroke-width="2"/></svg>
