<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="657" viewBox="0 0 1280 657" role="img" aria-labelledby="title desc">
<title id="title">Trust boundaries and production requirements</title><desc id="desc">The local synthetic process checks consistency and returns read-only assessments. Editable evidence and unauthenticated loopback access are limits. A separate proposed production region requires identity, permissions, trusted evidence and tenant tests. Human review does not grant execution permission.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1730"/><stop offset="1" stop-color="#34358c"/></linearGradient><linearGradient id="accent"><stop stop-color="#47d8ec"/><stop offset="1" stop-color="#ac9bff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="#526580"/></marker></defs>
<rect x="0" y="0" width="1280" height="657" rx="24" fill="#0b1730"/><text xml:space="preserve" x="48" y="57" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">The assessment stops before operational authority</text><text xml:space="preserve" x="48" y="91" fill="#becce7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Read-only behavior is implemented. Enterprise identity and independent evidence authenticity are not.</text><rect x="32" y="128" width="800" height="382" rx="18" fill="#142443" stroke="#54668c" stroke-width="2"/><text xml:space="preserve" x="58" y="163" fill="#47d8ec" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">IMPLEMENTED LOCAL PROCESS · SYNTHETIC DATA</text><rect x="58" y="192" width="362" height="112" rx="14" fill="#0d1b35" stroke="#455b82" stroke-width="2"/><text xml:space="preserve" x="78" y="225" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Narrow input surface</text><text xml:space="preserve" x="78" y="256" fill="#cbd8f1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Two tools; strict schemas</text><text xml:space="preserve" x="78" y="280" fill="#cbd8f1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Extra approval claims rejected</text><rect x="444" y="192" width="362" height="112" rx="14" fill="#0d1b35" stroke="#455b82" stroke-width="2"/><text xml:space="preserve" x="464" y="225" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Editable evidence root</text><text xml:space="preserve" x="464" y="256" fill="#cbd8f1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Packaged fictional records</text><text xml:space="preserve" x="464" y="280" fill="#cbd8f1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Consistency ≠ authenticity</text><rect x="58" y="330" width="362" height="112" rx="14" fill="#0d1b35" stroke="#455b82" stroke-width="2"/><text xml:space="preserve" x="78" y="363" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Conservative results</text><text xml:space="preserve" x="78" y="394" fill="#cbd8f1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Invalid stores fail closed</text><text xml:space="preserve" x="78" y="418" fill="#cbd8f1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Missing / conflicting proof blocks</text><rect x="444" y="330" width="362" height="112" rx="14" fill="#0d1b35" stroke="#455b82" stroke-width="2"/><text xml:space="preserve" x="464" y="363" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Local transport</text><text xml:space="preserve" x="464" y="394" fill="#cbd8f1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">stdio or 127.0.0.1 HTTP</text><text xml:space="preserve" x="464" y="418" fill="#cbd8f1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Other local processes can call</text><text xml:space="preserve" x="58" y="483" fill="#becce7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">No authentication, source ACLs, signatures or tenant isolation in this prototype.</text><rect x="864" y="128" width="384" height="382" rx="18" fill="#1e214a" stroke="#b29cff" stroke-width="2" stroke-dasharray="8 6"/><text xml:space="preserve" x="890" y="163" fill="#ac9bff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">PROPOSED PRODUCTION BOUNDARY</text><text xml:space="preserve" x="890" y="208" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Glean connection: unverified</text><text xml:space="preserve" x="890" y="251" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Authenticated user identity</text><text xml:space="preserve" x="890" y="288" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Permission-scoped evidence</text><text xml:space="preserve" x="890" y="325" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Trusted approval / role source</text><text xml:space="preserve" x="890" y="362" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">TLS, audit retention, rate limits</text><text xml:space="preserve" x="890" y="405" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Authorized tenant validation</text><text xml:space="preserve" x="890" y="467" fill="#cbd8f1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">These controls require future work.</text><rect x="32" y="542" width="1216" height="82" rx="18" fill="#0a1429" stroke="#556b92" stroke-width="2"/><text xml:space="preserve" x="58" y="575" fill="#47d8ec" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">HUMAN OVERSIGHT</text><text xml:space="preserve" x="58" y="607" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Review evidence and blockers. Operational permission remains with a separate authorized system.</text></svg>
