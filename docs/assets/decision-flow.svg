<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="904" viewBox="0 0 1280 904" role="img" aria-labelledby="title desc">
<title id="title">Evidence validation decision flow</title><desc id="desc">Strict input and store checks precede action lookup. Procedure, request time, owner/supporting evidence and approval checks produce blockers. Complete evidence is only eligible for human review. Invalid stores and unknown actions return blocked early.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1730"/><stop offset="1" stop-color="#34358c"/></linearGradient><linearGradient id="accent"><stop stop-color="#47d8ec"/><stop offset="1" stop-color="#ac9bff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="#526580"/></marker></defs>
<rect x="0" y="0" width="1280" height="904" rx="24" fill="#f4f7fc"/><text xml:space="preserve" x="48" y="57" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">How action evidence becomes a review assessment</text><text xml:space="preserve" x="48" y="91" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Actual sequence in assess_action_readiness. Checks collect blockers; they never authorize execution.</text><rect x="54" y="144" width="835" height="73" rx="14" fill="#ffffff" stroke="#d5deee" stroke-width="2"/><circle cx="86" cy="176" r="17" fill="#e9edff"/><text xml:space="preserve" x="86" y="182" fill="#6050a0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text><text xml:space="preserve" x="118" y="175" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Validate identifier; load the synthetic store</text><text xml:space="preserve" x="118" y="202" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Strict ACT identifier, duplicate-key check and Pydantic validation.</text><path d="M86 217V231" fill="none" stroke="#526580" stroke-width="2" marker-end="url(#arrow)"/><rect x="54" y="239" width="835" height="73" rx="14" fill="#ffffff" stroke="#d5deee" stroke-width="2"/><circle cx="86" cy="271" r="17" fill="#e9edff"/><text xml:space="preserve" x="86" y="277" fill="#6050a0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text><text xml:space="preserve" x="118" y="270" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Find the stored action</text><text xml:space="preserve" x="118" y="297" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Select one action and its exact procedure reference.</text><path d="M86 312V326" fill="none" stroke="#526580" stroke-width="2" marker-end="url(#arrow)"/><rect x="54" y="334" width="835" height="73" rx="14" fill="#ffffff" stroke="#d5deee" stroke-width="2"/><circle cx="86" cy="366" r="17" fill="#e9edff"/><text xml:space="preserve" x="86" y="372" fill="#6050a0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">03</text><text xml:space="preserve" x="118" y="365" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Check procedure and request time</text><text xml:space="preserve" x="118" y="392" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Current + approved + effective; request must not be in the future.</text><path d="M86 407V421" fill="none" stroke="#526580" stroke-width="2" marker-end="url(#arrow)"/><rect x="54" y="429" width="835" height="91" rx="14" fill="#ffffff" stroke="#d5deee" stroke-width="2"/><circle cx="86" cy="461" r="17" fill="#e9edff"/><text xml:space="preserve" x="86" y="467" fill="#6050a0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">04</text><text xml:space="preserve" x="118" y="460" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Validate owner confirmation and supporting evidence</text><text xml:space="preserve" x="118" y="487" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Every required record must match action, procedure, scope and kind.</text><text xml:space="preserve" x="118" y="511" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Request time ≤ recorded time ≤ evaluation time.</text><path d="M86 520V534" fill="none" stroke="#526580" stroke-width="2" marker-end="url(#arrow)"/><rect x="54" y="542" width="835" height="112" rx="14" fill="#ffffff" stroke="#d5deee" stroke-width="2"/><circle cx="86" cy="574" r="17" fill="#e9edff"/><text xml:space="preserve" x="86" y="580" fill="#6050a0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">05</text><text xml:space="preserve" x="118" y="573" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Evaluate all stored approvals for this action</text><text xml:space="preserve" x="118" y="600" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">None → missing. Any rejection → conflicting.</text><text xml:space="preserve" x="118" y="624" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">All context/time checks match → present. Otherwise → insufficient.</text><path d="M86 654V668" fill="none" stroke="#526580" stroke-width="2" marker-end="url(#arrow)"/><rect x="54" y="679" width="835" height="99" rx="14" fill="#e8f7fa" stroke="#86c9d5" stroke-width="2"/><text xml:space="preserve" x="84" y="714" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">06   Aggregate blockers</text><text xml:space="preserve" x="84" y="748" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">No blockers → eligible_for_human_review. Any blocker → blocked.</text><rect x="926" y="144" width="304" height="336" rx="18" fill="#0b1730"/><text xml:space="preserve" x="951" y="183" fill="#47d8ec" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">EARLY RETURNS</text><text xml:space="preserve" x="951" y="225" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Malformed input</text><text xml:space="preserve" x="951" y="254" fill="#c8d3eb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Protocol validation error</text><text xml:space="preserve" x="951" y="303" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Invalid / unavailable store</text><text xml:space="preserve" x="951" y="332" fill="#c8d3eb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Blocked, evidence unavailable</text><text xml:space="preserve" x="951" y="381" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Unknown action</text><text xml:space="preserve" x="951" y="410" fill="#c8d3eb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Blocked, action not found</text><rect x="926" y="509" width="304" height="269" rx="18" fill="#efeaff" stroke="#c0b4e4" stroke-width="2"/><text xml:space="preserve" x="951" y="548" fill="#6050a0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">APPROVAL MATCH</text><text xml:space="preserve" x="951" y="588" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Exact procedure + scope</text><text xml:space="preserve" x="951" y="619" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Required role string</text><text xml:space="preserve" x="951" y="650" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Request ≤ recorded ≤ now</text><text xml:space="preserve" x="951" y="681" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">now &lt; expiry</text><text xml:space="preserve" x="951" y="728" fill="#152643" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Identities are not verified</text><text xml:space="preserve" x="951" y="755" fill="#526580" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">now = fixed snapshot time</text><rect x="54" y="810" width="1176" height="59" rx="14" fill="#0b1730"/><text xml:space="preserve" x="80" y="847" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Every action result: human_review_required = true  ·  execution_authorized = false</text></svg>
